name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # يشتغل تلقائي كل يوم الساعة 12 بالليل UTC
  workflow_dispatch:        # يسمحلك تشغله يدوي كمان من تبويب Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake game from GitHub contributions
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: moamenesam
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push the generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
